<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV GRATIDÃO V15 - CONTROLE REMOTO</title>
<link rel="manifest" href="manifest.json">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{position:sticky;top:0;background:#111;border-bottom:3px solid #FFD700;padding:10px;display:flex;gap:6px;align-items:center;z-index:99}
.btn-gold{background:#FFD700;color:#000;border:0;padding:11px 14px;border-radius:12px;font-weight:bold}
.btn2{background:#222;color:#fff;border:1px solid #444;padding:9px 10px;border-radius:10px}
.tabs{display:flex;gap:6px;padding:8px;overflow:auto;background:#000;border-bottom:1px solid #222;position:sticky;top:56px;z-index:80}
.tab{padding:10px 14px;border-radius:20px;background:#222;border:1px solid #333;color:#fff;white-space:nowrap}
.tab.active{background:#FFD700;color:#000;font-weight:bold}
.canal{background:#151515;border:1px solid #2a2a2a;border-radius:16px;margin:8px 10px;padding:12px}
.play{width:100%;background:#FFD700;color:#000;border:0;padding:14px;border-radius:12px;font-weight:bold;font-size:15px;margin-top:8px}
.gravar{background:#111;color:#FFD700;border:1px solid #FFD700;padding:10px;border-radius:10px;width:48%}
.trash{background:#2a0a0a;border:1px solid #700;color:#ff5a5a;padding:10px;border-radius:10px;width:48%}
.search{margin:10px;padding:8px;background:#111;border-radius:12px;border:1px solid #333}
.search input{width:100%;padding:12px;border-radius:10px;background:#000;border:1px solid #333;color:#fff;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">
<b style="color:#FFD700;flex:1">📺 TV GRATIDÃO V15 - OFICIAL</b>
<button class="btn-gold" onclick="if(deferred){deferred.prompt()}else{alert('⋮ > Instalar app')}">📲 Instalar</button>
</div>
<div class="tabs">
<button class="tab active" onclick="setTab('todos',this)">📺 Todos (Oficial)</button>
<button class="tab" onclick="setTab('favoritos',this)">⭐ Fav (<span id="favC">0</span>)</button>
<button class="tab" onclick="setTab('gravados',this)">🔴 Gravados (<span id="gravC">0</span>)</button>
<button class="tab" onclick="setTab('storage',this)">💾 Armazenamento</button>
</div>
<div class="search"><input id="busca" placeholder="Buscar canal..." oninput="render()"></div>
<div id="lista"></div>

<script>
let deferred=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
let tab='todos',favoritos=JSON.parse(localStorage.getItem('fv15')||'[]'),gravados=JSON.parse(localStorage.getItem('gv15')||'[]');
let canais=[
{nome:'SBT News 24h',link:'https://www.youtube.com/@sbtnews/live',icon:'📺',desc:'Oficial SBT News - abre no YouTube'},
{nome:'Jovem Pan News',link:'https://www.youtube.com/@JovemPanNews/live',icon:'📰',desc:'Oficial - 24h (seu print funcionou)'},
{nome:'CNN Brasil',link:'https://www.youtube.com/@cnnbrasil/live',icon:'📰',desc:'Oficial CNN (seu print funcionou)'},
{nome:'Record News',link:'https://www.youtube.com/@recordnews/live',icon:'📡',desc:'Oficial Record News - 24h'},
{nome:'Band Jornalismo',link:'https://www.youtube.com/@BandJornalismo/live',icon:'📺',desc:'Oficial Band'},
{nome:'TV Evangelizar',link:'https://www.youtube.com/@tvevangelizaroficial/live',icon:'🙏',desc:'Oficial - Padre Manzotti - Curitiba (corrigi seu link quebrado)'},
{nome:'Pluto TV - 100 canais grátis',link:'https://pluto.tv/live-tv',icon:'🎬',desc:'Legal e grátis - sem login'},
{nome:'Globoplay (1h grátis)',link:'https://globoplay.globo.com/ao-vivo/',icon:'🌐',desc:'Site oficial Globo'},
];

function setTab(n,el){tab=n;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');render();}
function isFav(n){return favoritos.includes(n)}
function toggleFav(n){if(isFav(n)){favoritos=favoritos.filter(x=>x!==n)}else{favoritos.push(n)}localStorage.setItem('fv15',JSON.stringify(favoritos));render();}
function abrir(u){window.open(u,'_blank');}
function gravar(n){let p=prompt('🔴 GRAVAR - '+n+'\nNome do programa:','');if(!p)return;let o={id:Date.now(),canal:n,prog:p,data:new Date().toLocaleString('pt-BR')};gravados.unshift(o);localStorage.setItem('gv15',JSON.stringify(gravados));render();}
function apagar(id){if(!confirm('Apagar? 🗑️'))return;gravados=gravados.filter(x=>x.id!==id);localStorage.setItem('gv15',JSON.stringify(gravados));render();}
function limpar(){if(!confirm('Limpar TUDO? 🗑️ Lixeira geral'))return;localStorage.removeItem('fv15');localStorage.removeItem('gv15');favoritos=[];gravados=[];render();}

function render(){
 let b=document.getElementById('busca').value.toLowerCase();
 let l=document.getElementById('lista');
 document.getElementById('favC').innerText=favoritos.length;
 document.getElementById('gravC').innerText=gravados.length;
 if(tab==='storage'){let u=(JSON.stringify(localStorage).length/1024).toFixed(2);l.innerHTML=`<div class="canal" style="border:1px dashed #FFD700"><h3 style="color:#FFD700;margin:0">💾 Armazenamento</h3><p>⭐ Favoritos: ${favoritos.length}</p><p>🔴 Gravados: ${gravados.length}</p><p>Uso: ${u} KB</p><button class="trash" style="width:100%" onclick="limpar()">🗑️ LIXEIRA GERAL - LIMPAR TUDO</button></div>`;return;}
 if(tab==='gravados'){if(!gravados.length){l.innerHTML='<div class="canal" style="text-align:center;color:#888">Nenhum gravado</div>';return;}l.innerHTML=gravados.map(g=>`<div class="canal" style="border-left:4px solid red"><b>🔴 ${g.prog}</b><br><small>${g.canal} - ${g.data}</small><br><button class="trash" style="margin-top:8px;width:100%" onclick="apagar(${g.id})">🗑️ Lixeira - Apagar</button></div>`).join('');return;}
 let f=canais.filter(c=>{if(tab==='favoritos'&&!isFav(c.nome))return false;if(b&&!c.nome.toLowerCase().includes(b))return false;return true;});
 l.innerHTML=f.map(c=>`<div class="canal"><div style="display:flex;align-items:center;gap:10px"><div style="width:44px;height:44px;background:#000;border:1px solid #333;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px">${c.icon}</div><div style="flex:1"><b>${c.nome} <span style="color:#0f0;font-size:10px">● OFICIAL</span></b><br><small style="color:#aaa">${c.desc}</small></div><button style="background:#222;border:1px solid #444;color:#FFD700;padding:8px 12px;border-radius:10px" onclick="toggleFav('${c.nome}')">${isFav(c.nome)?'⭐':'☆'}</button></div><button class="play" onclick="abrir('${c.link}')">▶️ VER AGORA - ABRE NO APP OFICIAL (100% funciona)</button><div style="display:flex;gap:6px;margin-top:6px"><button class="gravar" onclick="gravar('${c.nome}')">🔴 GRAVAR</button><button class="trash" onclick="toggleFav('${c.nome}')">🗑️ Favorito</button></div></div>`).join('');
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>
