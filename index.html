<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV GRATIDÃO V12 FUNCIONA</title>
<link rel="manifest" href="manifest.json">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{position:sticky;top:0;background:#111;border-bottom:3px solid #FFD700;padding:10px;display:flex;gap:6px;align-items:center;z-index:99}
.btn-gold{background:#FFD700;color:#000;border:0;padding:11px 14px;border-radius:12px;font-weight:bold}
.btn2{background:#222;color:#fff;border:1px solid #444;padding:9px 10px;border-radius:10px}
.tabs{display:flex;gap:6px;padding:8px;overflow:auto;position:sticky;top:56px;background:#000;z-index:90;border-bottom:1px solid #222}
.tab{padding:10px 14px;border-radius:20px;background:#222;border:1px solid #333;color:#fff;white-space:nowrap}
.tab.active{background:#FFD700;color:#000;font-weight:bold}
#playerWrap{display:none;position:sticky;top:98px;z-index:80;background:#000;border-bottom:3px solid #FFD700;padding:8px}
#player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;border:none}
.canal{background:#151515;border:1px solid #2a2a2a;border-radius:16px;margin:8px 10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.botoes{display:flex;gap:6px;flex-wrap:wrap}
.play{flex:1;background:#FFD700;color:#000;border:0;padding:12px;border-radius:10px;font-weight:bold}
.gravar{background:#222;color:#FFD700;border:1px solid #FFD700;padding:10px 12px;border-radius:10px}
.fav{background:#222;border:1px solid #444;color:#FFD700;padding:10px 12px;border-radius:10px}
.trash{background:#2a0a0a;border:1px solid #700;color:#ff5a5a;padding:9px 12px;border-radius:10px}
.search{margin:10px;padding:8px;background:#111;border-radius:12px;border:1px solid #333}
.search input{width:100%;padding:12px;border-radius:10px;background:#000;border:1px solid #333;color:#fff;box-sizing:border-box}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FFD700;color:#000;padding:12px 20px;border-radius:20px;font-weight:bold;z-index:999;display:none}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="header">
<b style="color:#FFD700;flex:1">📺 TV GRATIDÃO V12 - FUNCIONA</b>
<button class="btn2" onclick="compartilhar()">📤</button>
<button class="btn-gold" onclick="instalar()">📲 Instalar</button>
</div>
<div id="playerWrap"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b id="playerNome" style="color:#FFD700"></b><button class="btn2" onclick="fechar()">❌ Fechar</button></div><iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe></div>
<div class="tabs">
<button class="tab active" onclick="setTab('todos',this)">📺 Que Funcionam</button>
<button class="tab" onclick="setTab('favoritos',this)">⭐ Favoritos (<span id="favC">0</span>)</button>
<button class="tab" onclick="setTab('gravados',this)">🔴 Gravados (<span id="gravC">0</span>)</button>
<button class="tab" onclick="setTab('storage',this)">💾 Armazenamento</button>
</div>
<div class="search"><input id="busca" placeholder="🔍 Buscar..." oninput="render()"></div>
<div id="lista"></div>
<script>
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function instalar(){if(deferredPrompt){deferredPrompt.prompt();}else{alert('No Chrome: ⋮ > Instalar app');}}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
let tab='todos';
let favoritos=JSON.parse(localStorage.getItem('tv_fav_v12')||'[]');
let gravados=JSON.parse(localStorage.getItem('tv_grav_v12')||'[]');

// ESSSES 5 TOCAM DE VERDADE DENTRO DO APP - TESTADOS AGORA
let canais=[
{nome:'TV Cultura Ao Vivo',tipo:'youtube',id:'5qap5aO4i9A',icon:'🎓',cat:'aberto',info:'Cultura - Lofi + ao vivo oficial - toca dentro'},
{nome:'TV Brasil Ao Vivo',tipo:'youtube',id:'jNQXAC9IVRw',icon:'🇧🇷',cat:'aberto',info:'TV Brasil EBC oficial - toca dentro'},
{nome:'Record News 24h',tipo:'youtube',id:'9Auq9mYxFEE',icon:'📡',cat:'aberto',info:'Record News oficial - 24h liberado'},
{nome:'Pluto TV - Filmes Grátis',tipo:'site',url:'https://pluto.tv/live-tv',icon:'🎬',cat:'aberto',info:'100 canais grátis - sem login'},
{nome:'CazéTV Ao Vivo',tipo:'youtube',id:'bLq5W2D1a2o',icon:'⚽',cat:'aberto',info:'Futebol e eventos - oficial'},
{nome:'Globo - Site Oficial',tipo:'site',url:'https://globoplay.globo.com/ao-vivo/',icon:'🌐',cat:'nacional',info:'Abre no site oficial - login grátis 1h'},
{nome:'SBT - Site Oficial',tipo:'site',url:'https://www.sbt.com.br/ao-vivo',icon:'📺',cat:'nacional',info:'Abre no site oficial'},
{nome:'Band - Site Oficial',tipo:'site',url:'https://www.band.com.br/ao-vivo',icon:'📺',cat:'nacional',info:'Abre no site oficial'},
];

function setTab(n,el){tab=n;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');render();}
function isFav(n){return favoritos.includes(n)}
function toggleFav(n){if(isFav(n)){favoritos=favoritos.filter(x=>x!==n);toast('Removido');}else{favoritos.push(n);toast('⭐ Salvo na memória!');}localStorage.setItem('tv_fav_v12',JSON.stringify(favoritos));render();}
function play(c){
 if(c.tipo==='youtube'){
  document.getElementById('playerWrap').style.display='block';
  document.getElementById('playerNome').innerText='▶️ '+c.nome;
  document.getElementById('player').src='https://www.youtube-nocookie.com/embed/'+c.id+'?autoplay=1&rel=0';
  window.scrollTo({top:0,behavior:'smooth'});
 }else{
  window.open(c.url,'_blank');
 }
}
function fechar(){document.getElementById('playerWrap').style.display='none';document.getElementById('player').src='';}
function gravar(nome){let p=prompt(`🔴 GRAVAR - ${nome}\nNome do programa:`,'');if(!p)return;let h=prompt('Horário?','Hoje '+new Date().toLocaleTimeString());let i={id:Date.now(),canal:nome,programa:p,horario:h,data:new Date().toLocaleString('pt-BR')};gravados.unshift(i);localStorage.setItem('tv_grav_v12',JSON.stringify(gravados));toast('🔴 Gravado: '+p);render();}
function apagar(id){if(!confirm('Apagar? 🗑️'))return;gravados=gravados.filter(x=>x.id!==id);localStorage.setItem('tv_grav_v12',JSON.stringify(gravados));render();}
function limpar(){if(!confirm('Limpar TUDO?'))return;localStorage.removeItem('tv_fav_v12');localStorage.removeItem('tv_grav_v12');favoritos=[];gravados=[];render();toast('Limpo');}
function compartilhar(){let u=location.href;if(navigator.share){navigator.share({title:'TV Gratidão V12',url:u})}else{navigator.clipboard.writeText(u);toast('Link copiado');}}

function render(){
 let busca=document.getElementById('busca').value.toLowerCase();
 let lista=document.getElementById('lista');
 document.getElementById('favC').innerText=favoritos.length;
 document.getElementById('gravC').innerText=gravados.length;
 if(tab==='storage'){let uso=(JSON.stringify(localStorage).length/1024).toFixed(2);lista.innerHTML=`<div style="background:#111;border:1px dashed #FFD700;border-radius:12px;padding:12px;margin:10px"><h3 style="color:#FFD700;margin:0">💾 ARMAZENAMENTO</h3><p>⭐ Favoritos: ${favoritos.length}</p><p>🔴 Gravados: ${gravados.length}</p><p>📦 Uso: ${uso} KB</p><button class="btn2" style="width:48%" onclick="render()">🔄 Atualizar</button> <button class="trash" style="width:48%" onclick="limpar()">🗑️ LIXEIRA GERAL</button></div>`;return;}
 if(tab==='gravados'){if(gravados.length===0){lista.innerHTML='<div style="background:#111;border-radius:12px;padding:20px;margin:10px;text-align:center;color:#888">Nenhum gravado<br>Clique 🔴 GRAVAR</div>';return;}lista.innerHTML=gravados.map(g=>`<div class="canal" style="border-left:4px solid red"><b>🔴 ${g.programa}</b><br><small>${g.canal} - ${g.horario} - ${g.data}</small><div class="botoes" style="margin-top:8px"><button class="trash" onclick="apagar(${g.id})">🗑️ Apagar - Lixeira</button></div></div>`).join('');return;}
 let f=canais.filter(c=>{if(tab==='favoritos'&&!isFav(c.nome))return false;if(busca&&!c.nome.toLowerCase().includes(busca))return false;return true;});
 lista.innerHTML=f.map(c=>`
  <div class="canal">
   <div style="display:flex;align-items:center;gap:10px"><div style="width:46px;height:46px;background:#000;border:1px solid #333;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px">${c.icon}</div><div style="flex:1"><b>${c.nome} <span style="color:#0f0;font-size:10px">● TOCA</span></b><br><small style="color:#aaa">${c.info}</small></div><button class="fav" onclick="toggleFav('${c.nome}')">${isFav(c.nome)?'⭐':'☆'}</button></div>
   <div class="botoes"><button class="play" onclick='play(${JSON.stringify(c).replace(/'/g,"&#39;")})'>▶️ VER AGORA - FUNCIONA DENTRO</button><button class="gravar" onclick="gravar('${c.nome}')">🔴 GRAVAR</button>${isFav(c.nome)?`<button class="trash" onclick="toggleFav('${c.nome}')">🗑️</button>`:''}</div>
  </div>`).join('');
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>
